<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auralook</title>
  <script>
    // Runs synchronously, before the page below has a chance to render at
    // all — this is what eliminates any flash of chat content before a
    // lock-check redirect. See app.py/chat.js comments for the full
    // explanation of why sessionStorage is the reliable signal here.
    (function () {
      var alreadyActive = sessionStorage.getItem("auralook_ctx_active") === "true";
      sessionStorage.setItem("auralook_ctx_active", "true");
      if (!alreadyActive) {
        window.location.replace("/lock");
      }
    })();
  </script>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}" />
  <meta name="theme-color" content="#4285F4" />
  <link rel="icon" href="{{ url_for('static', filename='icon-192.png') }}" />
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.png') }}" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Auralook" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body data-my-email="{{ my_email }}">
  <div class="app-shell">
    <header class="topbar">
      <span>Signed in as <strong>{{ my_name }}</strong></span>
      <a href="{{ url_for('logout') }}">Logout</a>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <h2>Chats</h2>
        <button id="add-contact-toggle-btn" class="add-toggle-btn" title="Add someone new">+ Add</button>
        <form id="add-contact-form" class="add-contact-form hidden">
          <input id="add-contact-email" type="email" placeholder="Email" required />
          <input id="add-contact-nickname" type="text" placeholder="Name to call them" required />
          <button type="submit">Add</button>
        </form>
        <p id="add-contact-error" class="error-text hidden"></p>
        <ul id="contacts-list"></ul>
      </aside>

      <main class="chat-area">
        <div id="no-chat" class="placeholder">
          Add someone by email and give them a name — chat anytime, online or offline.
        </div>

        <div id="contact-chat-window" class="hidden">
          <div class="chat-header">
            <span>
              <span id="contact-status-dot" class="status-dot offline"></span>
              <span id="contact-partner-name"></span>
            </span>
            <button id="contact-clear-btn" title="Clear this chat (delete for me, all messages)">Clear</button>
            <button id="contact-close-btn">Close</button>
          </div>
          <div id="contact-messages" class="messages"></div>
          <form id="contact-message-form">
            <input id="contact-message-input" autocomplete="off" placeholder="Type a message..." />
            <button type="submit">Send</button>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.js"></script>
  <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js");
    }
  </script>
</body>
</html>
