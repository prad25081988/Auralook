<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auralook</title>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}" />
  <meta name="theme-color" content="#4285F4" />
  <link rel="icon" href="{{ url_for('static', filename='icon-192.png') }}" />
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.png') }}" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Auralook" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body data-my-email="{{ my_email }}">
  <div class="app-shell">
    <header class="topbar">
      <span>Signed in as <strong>{{ display_name }}</strong></span>
      <a href="{{ url_for('logout') }}">Logout</a>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <h2>Online now</h2>
        <ul id="online-list"></ul>

        <h2 class="contacts-heading">Contacts</h2>
        <form id="add-contact-form" class="add-contact-form">
          <input id="add-contact-input" type="email" placeholder="Add by email" required />
          <button type="submit">+</button>
        </form>
        <p id="add-contact-error" class="error-text hidden"></p>
        <ul id="contacts-list"></ul>
      </aside>

      <main class="chat-area">
        <div id="no-chat" class="placeholder">
          Pick someone online for a live encrypted chat, or a contact to message anytime.
        </div>

        <div id="chat-window" class="hidden">
          <div class="chat-header">
            Chatting with <span id="partner-name"></span>
            <button id="select-mode-btn" title="Select multiple messages to delete">Select</button>
            <button id="delete-selected-btn" class="hidden" title="Delete all checked messages">Delete Selected</button>
            <button id="clear-chat-btn" title="Clear chat from your view only">Clear</button>
            <button id="leave-btn">Leave</button>
          </div>
          <div id="messages" class="messages"></div>
          <form id="message-form">
            <input id="message-input" autocomplete="off" placeholder="Type a message..." />
            <input type="file" id="image-input" accept="image/*" class="hidden" />
            <button type="button" id="image-btn" title="Send an image">📷</button>
            <button type="submit">Send</button>
          </form>
        </div>

        <div id="contact-chat-window" class="hidden">
          <div class="chat-header">
            <span>Contact: <span id="contact-partner-email"></span></span>
            <span class="contact-note">Last 5 messages kept · works offline</span>
            <button id="contact-close-btn">Close</button>
          </div>
          <div id="contact-messages" class="messages"></div>
          <form id="contact-message-form">
            <input id="contact-message-input" autocomplete="off" placeholder="Type a message..." />
            <button type="submit">Send</button>
          </form>
        </div>
      </main>
    </div>
  </div>

  <!-- Incoming request modal -->
  <div id="request-modal" class="modal hidden">
    <div class="modal-box">
      <p id="request-text"></p>
      <button id="accept-btn">Accept</button>
      <button id="decline-btn">Decline</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.js"></script>
  <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js");
    }
  </script>
</body>
</html>
