<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auralook — Sign In</title>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}" />
  <meta name="theme-color" content="#4285F4" />
  <link rel="icon" href="{{ url_for('static', filename='icon-192.png') }}" />
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.png') }}" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Auralook" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="center-page">
  <div class="card">
    <h1>Auralook</h1>
    {% if error %}<p class="error-text">{{ error }}</p>{% endif %}

    <div id="login-buttons">
      <a class="google-btn" href="{{ url_for('login') }}">
        Sign in with Google
      </a>
      {% if skip_login_enabled %}
      <p class="skip-note">— or —</p>
      <a class="skip-btn" href="{{ url_for('skip_login') }}">
        Skip Sign In
      </a>
      {% endif %}
    </div>

    <div id="lockout-message" class="hidden">
      <p class="subtitle">
        This device has been locked after too many incorrect PIN attempts.
        Please reinstall the app to try again.
      </p>
    </div>
  </div>

  <script>
    sessionStorage.setItem("auralook_ctx_active", "true");

    (function () {
      var justLocked = {{ 'true' if locked else 'false' }};
      if (justLocked) {
        localStorage.setItem('auralook_pin_locked', 'true');
      }
      var isLocked = localStorage.getItem('auralook_pin_locked') === 'true';
      if (isLocked) {
        document.getElementById('login-buttons').style.display = 'none';
        document.getElementById('lockout-message').classList.remove('hidden');
      }
    })();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js");
    }
  </script>
</body>
</html>
