<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auralook — Enter PIN</title>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}" />
  <meta name="theme-color" content="#4285F4" />
  <link rel="icon" href="{{ url_for('static', filename='icon-192.png') }}" />
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-192.png') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="center-page">
  <div class="card">
    <h1>Enter PIN</h1>
    <p class="subtitle">This app is invite-only. Enter the access PIN to continue.</p>
    {% if error %}<p class="error-text">{{ error }}</p>{% endif %}
    <form method="POST" class="stacked-form">
      <input type="password" name="pin" placeholder="PIN" autofocus required />
      <button type="submit" class="primary-btn">Continue</button>
    </form>
  </div>
  <script>
    sessionStorage.setItem("auralook_ctx_active", "true");
  </script>
</body>
</html>
